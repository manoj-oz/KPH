<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="enquiry-page">
  <div class="container">
    <section class="form-section">
      <div class="logo-container">
        <img src="KPH.jpg" alt="Logo" class="logo" />
      </div>

      <h2 class="page-heading">DEMO FORM</h2>

      <form id="demoForm">
        <!-- Enquiry ID -->
        <div class="form-group">
          <label for="studentEnquiryId">ENQUIRY ID:</label>
          <div class="input-container">
            <select id="studentEnquiryId">
              <option value="" disabled selected>Select Enquiry ID</option>
            </select>
          </div>
        </div>

        <!-- Full Name -->
        <div class="form-group">
          <label for="demoFullName">FULL NAME:</label>
          <div class="input-container">
            <input type="text" id="demoFullName" placeholder="Full Name" required />
          </div>
        </div>

        <!-- Phone Number -->
        <div class="form-group phone-group">
          <label for="countryCode" id="countryCodeLabel"></label>
          <div class="phone-input-container">
            <select id="countryCode">
              <option value="+91" selected>India (+91)</option>
              <option value="+1">USA (+1)</option>
              <option value="+44">UK (+44)</option>
            </select>
            <input type="text" id="phone" name="phone" placeholder="Phone Number" 
              title="Enter a valid 10-digit mobile number" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="demoEmail">EMAIL ID:</label>
          <div class="input-container">
            <input type="email" id="demoEmail" placeholder="Email ID" required />
          </div>
        </div>

        <!-- Course -->
        <div class="form-group">
          <label for="course">COURSE:</label>
          <div class="input-container">
            <input type="text" id="course" placeholder="course" required />
          </div>
        </div>

        <!-- Demo Date -->
        <div class="form-group">
          <div class="input-container">
            <input type="date" id="demoDate" name="demoDate" required />
            <label for="demoDate">DEMO DATE</label>
          </div>
        </div>

        <!-- Tutor Name -->
        <div class="form-group">
          <label for="tutorName">TUTOR NAME:</label>
          <div class="input-container">
            <input type="text" id="tutorName" placeholder="Tutor Name" required />
          </div>
        </div>

        <!-- Demo Time -->
        <div class="form-group">
          <label for="demoTime">DEMO TIME:</label>
          <div class="input-container">
            <input type="time" id="demoTime" required />
          </div>
        </div>

        <!-- Buttons -->
        <div class="button-container">
          <button type="submit" class="signup-btn">SUBMIT</button>
        </div>
        <div class="button-container">
          <button type="button" class="btn-back" onclick="goBack()">← Back</button>
        </div>
        <div class="button-container">
            <button type="button" class="btn-back" onclick="location.href='Demo-dashboard.html'">Demo
              Dashboard</button>
          </div>
      </form>
    </section>
  </div>

  <script>
    function goBack() {
      window.location.href = 'SelectAForm.html';
    }
  </script>
  <script type="module" src="js/demo.js"></script>

    <!-- Success Popup -->
<div id="successPopup" class="popup-overlay">
  <div class="popup-box">
    <h2>🎉 Congratulations!</h2>
    <p>Demo submitted successfully.</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>
</body>
</html>
